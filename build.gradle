plugins {
    id 'java'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
    implementation("net.kyori:adventure-api:4.14.0")
    implementation("net.kyori:adventure-text-minimessage:4.14.0")

    implementation("com.google.guava:guava:32.0.1-jre")
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(17))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def serverPluginsDir = file("C:/Users/misha/Proton Drive/mishanikolchuk03/My files/servers/minecraft/ChaosFrontierDev/plugins")

tasks.register('copyToServer', Copy) {
    dependsOn build
    from(layout.buildDirectory.dir("libs"))
    into(serverPluginsDir)
}

tasks.register('devWatch') {
    doLast {
        println "Watching for changes..."

        exec {
            // Unix: commandLine 'sh', '-c', './gradlew build copyToServer --continuous'
            commandLine "cmd", "/c", "gradlew.bat", "build", "copyToServer", "--continuous"
        }
    }
}